<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0700"/>
      <stop offset="55%" stop-color="#3d2e00"/>
      <stop offset="100%" stop-color="#7a5c00"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <rect width="900" height="230" rx="20" fill="url(#bgGrad)"/>
  <rect width="900" height="230" rx="20" fill="url(#glowSpot)"/>
  <!-- pulsing capture rings (left) -->
  <g>
    <circle cx="110" cy="115" r="30" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="26;44;26" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.05;0.75" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="115" r="5.5" fill="#FDE68A"/>
  </g>
  <!-- pulsing capture rings (right) -->
  <g>
    <circle cx="790" cy="115" r="30" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="26;44;26" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.05;0.75" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="115" r="5.5" fill="#FDE68A"/>
  </g>
  <!-- flickering lightning bolts -->
  <path d="M172 65 L156 103 L175 103 L150 155 L196 100 L176 100 Z" fill="#FEF3C7" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/>
  </path>
  <path d="M728 65 L712 103 L731 103 L706 155 L752 100 L732 100 Z" fill="#FEF3C7" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/>
  </path>
  <!-- title with glow -->
  <text x="450" y="112" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="52" font-weight="700" fill="#FDE68A" filter="url(#textGlow)">SRISTI PAUL</text>
  <text x="450" y="112" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="52" font-weight="700" fill="#FFFBEB">SRISTI PAUL</text>
  <!-- subtitle -->
  <text x="450" y="150" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#FCD34D">ECE Undergrad  •  Programmer  •  IoT Explorer</text>
  <!-- animated underline sweep -->
  <rect y="172" height="3" rx="1.5" fill="#FBBF24" filter="url(#softGlow)">
    <animate attributeName="x" values="450;330;330;450" keyTimes="0;0.4;0.8;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;240;240;0" keyTimes="0;0.4;0.8;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- tagline -->
  <text x="450" y="200" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#FBBF24" letter-spacing="3">⚡ TRAINER STATUS: LEVELING UP ⚡</text>
</svg>
