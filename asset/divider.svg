<svg width="900" height="36" viewBox="0 0 900 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shine" x1="-20%" y1="0%" x2="30%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
      <animate attributeName="x1" values="-30%;130%" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20%;180%" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="lineGlow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>
  <line x1="20" y1="18" x2="880" y2="18" stroke="#7a5c00" stroke-width="2"/>
  <line x1="20" y1="18" x2="880" y2="18" stroke="url(#shine)" stroke-width="2.4" filter="url(#lineGlow)"/>
  <circle cx="20" cy="18" r="4" fill="#FBBF24"/>
  <circle cx="880" cy="18" r="4" fill="#FBBF24"/>
</svg>
