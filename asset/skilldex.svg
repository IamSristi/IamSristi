<svg width="620" height="330" viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5c00"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="barGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="panelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="612" height="322" rx="14" fill="#110b00" stroke="#7a5c00" stroke-width="2"/>
  <rect x="4" y="4" width="612" height="322" rx="14" fill="none" stroke="#FBBF24" stroke-width="1" opacity="0.35" filter="url(#panelGlow)"/>

  <text x="26" y="34" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" letter-spacing="2">⚡ TRAINER SKILL DEX ⚡</text>
  <circle cx="588" cy="28" r="7" fill="none" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="588" cy="28" r="2.5" fill="#FDE68A"/>

  <!-- C / C++ -->
  <text x="26" y="70" font-family="Consolas, monospace" font-size="13" fill="#FFFBEB">C / C++</text>
  <text x="500" y="70" font-family="Consolas, monospace" font-size="11" fill="#FCD34D" text-anchor="end">LV. 85</text>
  <rect x="26" y="78" width="480" height="10" rx="5" fill="#3d2e00"/>
  <rect x="26" y="78" width="408" height="10" rx="5" fill="url(#barFill)" filter="url(#barGlow)"/>

  <!-- Java -->
  <text x="26" y="108" font-family="Consolas, monospace" font-size="13" fill="#FFFBEB">Java</text>
  <text x="500" y="108" font-family="Consolas, monospace" font-size="11" fill="#FCD34D" text-anchor="end">LV. 78</text>
  <rect x="26" y="116" width="480" height="10" rx="5" fill="#3d2e00"/>
  <rect x="26" y="116" width="374" height="10" rx="5" fill="url(#barFill)" filter="url(#barGlow)"/>

  <!-- Python -->
  <text x="26" y="146" font-family="Consolas, monospace" font-size="13" fill="#FFFBEB">Python</text>
  <text x="500" y="146" font-family="Consolas, monospace" font-size="11" fill="#FCD34D" text-anchor="end">LV. 88</text>
  <rect x="26" y="154" width="480" height="10" rx="5" fill="#3d2e00"/>
  <rect x="26" y="154" width="422" height="10" rx="5" fill="url(#barFill)" filter="url(#barGlow)"/>

  <!-- HTML/CSS -->
  <text x="26" y="184" font-family="Consolas, monospace" font-size="13" fill="#FFFBEB">HTML / CSS</text>
  <text x="500" y="184" font-family="Consolas, monospace" font-size="11" fill="#FCD34D" text-anchor="end">LV. 82</text>
  <rect x="26" y="192" width="480" height="10" rx="5" fill="#3d2e00"/>
  <rect x="26" y="192" width="394" height="10" rx="5" fill="url(#barFill)" filter="url(#barGlow)"/>

  <!-- Figma -->
  <text x="26" y="222" font-family="Consolas, monospace" font-size="13" fill="#FFFBEB">Figma</text>
  <text x="500" y="222" font-family="Consolas, monospace" font-size="11" fill="#FCD34D" text-anchor="end">LV. 70</text>
  <rect x="26" y="230" width="480" height="10" rx="5" fill="#3d2e00"/>
  <rect x="26" y="230" width="336" height="10" rx="5" fill="url(#barFill)" filter="url(#barGlow)"/>

  <!-- Git/GitHub -->
  <text x="26" y="260" font-family="Consolas, monospace" font-size="13" fill="#FFFBEB">Git / GitHub</text>
  <text x="500" y="260" font-family="Consolas, monospace" font-size="11" fill="#FCD34D" text-anchor="end">LV. 90</text>
  <rect x="26" y="268" width="480" height="10" rx="5" fill="#3d2e00"/>
  <rect x="26" y="268" width="432" height="10" rx="5" fill="url(#barFill)" filter="url(#barGlow)"/>

  <!-- GenAI -->
  <text x="26" y="200" font-family="Consolas, monospace" font-size="13" fill="#FFFBEB">GenAI</text>
  <text x="500" y="200" font-family="Consolas, monospace" font-size="11" fill="#FCD34D" text-anchor="end">LV. 80</text>
  <rect x="26" y="210" width="480" height="10" rx="5" fill="#3d2e00"/>
  <rect x="26" y="210" width="384" height="10" rx="5" fill="url(#barFill)" filter="url(#barGlow)">
    <animate attributeName="opacity" values="1;0.75;1" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
