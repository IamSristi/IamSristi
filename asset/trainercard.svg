<svg width="620" height="200" viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110b00"/>
      <stop offset="100%" stop-color="#3d2e00"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="orbTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#7a5c00"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="612" height="192" rx="16" fill="url(#cardBg)" stroke="#7a5c00" stroke-width="2"/>
  <rect x="4" y="4" width="612" height="192" rx="16" fill="none" stroke="#FBBF24" stroke-width="1" opacity="0.35" filter="url(#cardGlow)"/>
  <!-- capture orb -->
  <g>
    <circle cx="90" cy="100" r="52" fill="url(#orbTop)"/>
    <path d="M38 100 A52 52 0 0 1 142 100 Z" fill="#110b00" opacity="0.85"/>
    <rect x="38" y="97" width="104" height="6" fill="#110b00"/>
    <circle cx="90" cy="100" r="14" fill="#110b00" stroke="#FDE68A" stroke-width="3"/>
    <circle cx="90" cy="100" r="5" fill="#FDE68A">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- ID text -->
  <text x="175" y="46" font-family="Verdana, sans-serif" font-size="22" font-weight="700" fill="#FFFBEB">SRISTI PAUL</text>
  <text x="175" y="68" font-family="Consolas, monospace" font-size="13" fill="#FCD34D">Class: ECE Undergraduate  •  Region: Programming</text>
