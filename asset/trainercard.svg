    <rect x="175" y="82" width="88" height="26" rx="13" fill="#FDE68A"/>
    <text x="219" y="99" text-anchor="middle">JAVA</text>
    <rect x="271" y="82" width="76" height="26" rx="13" fill="#FBBF24"/>
    <text x="309" y="99" text-anchor="middle">DSA</text>
    <rect x="355" y="82" width="82" height="26" rx="13" fill="#F59E0B"/>
    <text x="396" y="99" text-anchor="middle">OOPs</text>
    <rect x="445" y="82" width="94" height="26" rx="13" fill="#D97706"/>
    <text x="492" y="99" text-anchor="middle" fill="#FFFBEB">IoT</text>
  </g>
  <!-- badges/achievements row -->
  <text x="175" y="130" font-family="Consolas, monospace" font-size="12" fill="#FDE68A">Badges Earned:</text>
  <g>
    <circle cx="290" cy="126" r="9" fill="#FBBF24"/>
    <circle cx="316" cy="126" r="9" fill="#FBBF24"/>
    <circle cx="342" cy="126" r="9" fill="#FBBF24"/>
    <circle cx="368" cy="126" r="9" fill="none" stroke="#7a5c00" stroke-width="2"/>
    <circle cx="394" cy="126" r="9" fill="none" stroke="#7a5c00" stroke-width="2"/>
