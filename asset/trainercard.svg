<svg width="620" height="200" viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03110a"/>
      <stop offset="100%" stop-color="#0a3320"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="orbTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="612" height="192" rx="16" fill="url(#cardBg)" stroke="#0f5132" stroke-width="2"/>
  <rect x="4" y="4" width="612" height="192" rx="16" fill="none" stroke="#34D399" stroke-width="1" opacity="0.35" filter="url(#cardGlow)"/>

  <!-- capture orb -->
  <g>
    <circle cx="90" cy="100" r="52" fill="url(#orbTop)"/>
    <path d="M38 100 A52 52 0 0 1 142 100 Z" fill="#03110a" opacity="0.85"/>
    <rect x="38" y="97" width="104" height="6" fill="#03110a"/>
    <circle cx="90" cy="100" r="14" fill="#03110a" stroke="#6EE7B7" stroke-width="3"/>
    <circle cx="90" cy="100" r="5" fill="#6EE7B7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ID text -->
  <text x="175" y="46" font-family="Verdana, sans-serif" font-size="22" font-weight="700" fill="#D1FAE5">SRISTI PAUL</text>
  <text x="175" y="68" font-family="Consolas, monospace" font-size="13" fill="#86EFAC">Class: ECE Undergraduate  •  Region: IoT &amp; Software</text>

  <!-- type badges -->
  <g font-family="Verdana, sans-serif" font-size="12" font-weight="700" fill="#03110a">
    <rect x="175" y="82" width="88" height="26" rx="13" fill="#FBBF24"/>
    <text x="219" y="99" text-anchor="middle">⚡ Programming</text>

    <rect x="271" y="82" width="76" height="26" rx="13" fill="#60A5FA"/>
    <text x="309" y="99" text-anchor="middle">🌐 Design</text>

    <rect x="355" y="82" width="82" height="26" rx="13" fill="#C084FC"/>
    <text x="396" y="99" text-anchor="middle">✨ IoT</text>

    <rect x="445" y="82" width="94" height="26" rx="13" fill="#34D399"/>
    <text x="492" y="99" text-anchor="middle">💻 CS Fundamentals</text>
  </g>

  <!-- badges/achievements row -->
  <text x="175" y="130" font-family="Consolas, monospace" font-size="12" fill="#6EE7B7">Badges Earned:</text>
  <g>
    <circle cx="290" cy="126" r="9" fill="#34D399"/>
    <circle cx="316" cy="126" r="9" fill="#34D399"/>
    <circle cx="342" cy="126" r="9" fill="#34D399"/>
    <circle cx="368" cy="126" r="9" fill="none" stroke="#0f5132" stroke-width="2"/>
    <circle cx="394" cy="126" r="9" fill="none" stroke="#0f5132" stroke-width="2"/>
  </g>

  <text x="175" y="158" font-family="Consolas, monospace" font-size="12" fill="#86EFAC">"Exploring the intersection of software &amp; hardware, one commit at a time."</text>
</svg>
